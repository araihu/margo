version: 1
source: showcase/content
output: showcase/dist
assets: local
offline: true
site:
  name: Margo
  description: A visual guide to Margo's Markdown compiler, Go module, and publishing CLI.
  version: v0.0.17
  repository_url: https://github.com/araihu/margo
  base_url: https://margo.araihu.com
  home: index.md
  logo: assets/logo.svg
  icon: assets/logo.svg
  social_image:
    path: assets/social/margo-social-v2.jpg
    alt: "Margo showcase: Markdown flowing into HTML, sites, PDFs, and decks."
layout:
  kind: docs
  default:
    families: [module, cli, schemas, fenced-types]
    sidebar: true
    toc: true
    content:
      layout: article
  values:
    family: default
locales:
  default: en
  supported: [en]
navigation:
  mode: file-tree
theme:
  builtin: false
  name: margo
  allow_switch_theme: true
  color_mode: system
themes:
  - name: margo
    css_url: themes/margo.css
    token_catalog: themes/margo.tokens.yaml
