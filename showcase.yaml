version: 1
source: showcase/content
output: showcase/dist
assets: local
offline: true
site:
  name: Margo
  description: A visual guide to Margo's Markdown compiler, Go module, and publishing CLI.
  version: v0.0.5
  repository_url: https://github.com/araihu/margo
  base_url: https://margo.araihu.com
  home: index.md
  logo: assets/logo.svg
  icon: assets/logo.svg
  social_image:
    path: assets/social/margo-social-v2.jpg
    alt: "Margo showcase: Markdown flowing into HTML, sites, PDFs, and decks."
layouts:
  default: docs
  profiles:
    landing:
      frame:
        builtin: top-main-footer
    docs:
      frame:
        builtin: top-left-main-right-footer
locales:
  default: en
  supported: [en]
navigation:
  mode: file-tree
  families:
    - id: tour
      label: Tour
      source: .
      overview: index.md
      layout: landing
    - id: module
      label: Module
      source: module
      overview: module/index.md
      layout: docs
    - id: cli
      label: CLI
      source: cli
      overview: cli/index.md
      layout: docs
theme:
  builtin: false
  name: margo
  allow_switch_theme: false
  color_mode: system
themes:
  - name: margo
    css_url: themes/margo.css
    token_catalog: themes/margo.tokens.yaml
