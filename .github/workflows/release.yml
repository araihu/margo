name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare trusted release context
        shell: bash
        env:
          MARGO_CACHE_DOMAIN: trusted-release
          MARGO_RUN_ID: ${{ github.run_id }}
          MARGO_RUN_ATTEMPT: ${{ github.run_attempt }}
          MARGO_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/write-dagger-context.sh

      - name: Materialize self-contained Git metadata
        shell: bash
        run: scripts/prepare-dagger-git.sh

      - name: Install exact Dagger CLI
        shell: bash
        env:
          DAGGER_INSTALL_DIRECTORY: ${{ runner.temp }}/dagger-v0.21.8
        run: |
          scripts/install-dagger.sh "$DAGGER_INSTALL_DIRECTORY"
          printf '%s\n' "$DAGGER_INSTALL_DIRECTORY" >> "$GITHUB_PATH"

      - name: Verify tag and source with Dagger
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 {print $2}')" = 'v0.21.8'
          dagger call release-verify --git-bundle=.dagger-git.bundle --ci-context=.dagger-ci-context.json

  release:
    name: Publish release binaries
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false

      - name: Build and publish with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
