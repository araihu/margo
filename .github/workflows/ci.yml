name: Required CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  required:
    name: Single-module CI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated cache context
        shell: bash
        env:
          MARGO_CACHE_DOMAIN: ${{ github.event_name == 'pull_request' && format('untrusted-pr-{0}', github.event.pull_request.number) || 'trusted-main' }}
          MARGO_RUN_ID: ${{ github.run_id }}
          MARGO_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/write-dagger-context.sh

      - name: Install exact Dagger CLI
        shell: bash
        env:
          DAGGER_INSTALL_DIRECTORY: ${{ runner.temp }}/dagger-v0.21.8
        run: |
          scripts/install-dagger.sh "$DAGGER_INSTALL_DIRECTORY"
          printf '%s\n' "$DAGGER_INSTALL_DIRECTORY" >> "$GITHUB_PATH"

      - name: Run required CI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 {print $2}')" = 'v0.21.8'
          dagger call required --ci-context=.dagger-ci-context.json

  portable-linux:
    name: Release shape (portable-linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated cache context
        shell: bash
        env:
          MARGO_CACHE_DOMAIN: ${{ github.event_name == 'pull_request' && format('untrusted-pr-{0}', github.event.pull_request.number) || 'trusted-main' }}
          MARGO_RUN_ID: ${{ github.run_id }}
          MARGO_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/write-dagger-context.sh

      - name: Install exact Dagger CLI
        shell: bash
        env:
          DAGGER_INSTALL_DIRECTORY: ${{ runner.temp }}/dagger-v0.21.8
        run: |
          scripts/install-dagger.sh "$DAGGER_INSTALL_DIRECTORY"
          printf '%s\n' "$DAGGER_INSTALL_DIRECTORY" >> "$GITHUB_PATH"

      - name: Build and verify release shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 {print $2}')" = 'v0.21.8'
          dagger call portable-release-shape --ci-context=.dagger-ci-context.json

  native-release-shape:
    name: Release shape (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            runner: macos-15
            cgo: '1'
            artifact: margo
          - label: windows
            runner: windows-2025
            cgo: '0'
            artifact: margo.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false

      - name: Build one root-versioned margo binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          MARGO_ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -o "dist/${MARGO_ARTIFACT}" ./cmd/margo
          go version -m "dist/${MARGO_ARTIFACT}"
          scripts/verify-release-shape.sh dist

  goreleaser:
    name: GoReleaser snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated cache context
        shell: bash
        env:
          MARGO_CACHE_DOMAIN: ${{ github.event_name == 'pull_request' && format('untrusted-pr-{0}', github.event.pull_request.number) || 'trusted-main' }}
          MARGO_RUN_ID: ${{ github.run_id }}
          MARGO_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/write-dagger-context.sh

      - name: Materialize self-contained Git metadata
        shell: bash
        run: scripts/prepare-dagger-git.sh

      - name: Install exact Dagger CLI
        shell: bash
        env:
          DAGGER_INSTALL_DIRECTORY: ${{ runner.temp }}/dagger-v0.21.8
        run: |
          scripts/install-dagger.sh "$DAGGER_INSTALL_DIRECTORY"
          printf '%s\n' "$DAGGER_INSTALL_DIRECTORY" >> "$GITHUB_PATH"

      - name: Build and verify release snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 {print $2}')" = 'v0.21.8'
          dagger call snapshot --git-bundle=.dagger-git.bundle --ci-context=.dagger-ci-context.json sync

  musl:
    name: Portable musl and no-browser behavior
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated cache context
        shell: bash
        env:
          MARGO_CACHE_DOMAIN: ${{ github.event_name == 'pull_request' && format('untrusted-pr-{0}', github.event.pull_request.number) || 'trusted-main' }}
          MARGO_RUN_ID: ${{ github.run_id }}
          MARGO_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/write-dagger-context.sh

      - name: Install exact Dagger CLI
        shell: bash
        env:
          DAGGER_INSTALL_DIRECTORY: ${{ runner.temp }}/dagger-v0.21.8
        run: |
          scripts/install-dagger.sh "$DAGGER_INSTALL_DIRECTORY"
          printf '%s\n' "$DAGGER_INSTALL_DIRECTORY" >> "$GITHUB_PATH"

      - name: Run Alpine contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 {print $2}')" = 'v0.21.8'
          dagger call musl --ci-context=.dagger-ci-context.json
