name: Publish schema reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'dagger.json'
      - 'dagger/**'
      - 'schema/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-image://registry.dagger.io/engine:v0.21.11@sha256:6b557cc8b5fdfee0e2e8c82d451ac922097a1255482143e1b96c0be3ff2a303c

jobs:
  deploy:
    name: Publish exact schema bytes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Dagger CLI
        shell: bash
        env:
          DAGGER_INSTALL_DIRECTORY: ${{ runner.temp }}/dagger-v0.21.11
        run: |
          scripts/install-dagger.sh "$DAGGER_INSTALL_DIRECTORY"
          printf '%s\n' "$DAGGER_INSTALL_DIRECTORY" >> "$GITHUB_PATH"

      - name: Stage schema-only site with Dagger
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 {print $2}')" = 'v0.21.11'
          dagger call pages-site export --path=_site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload exact schema bytes
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
