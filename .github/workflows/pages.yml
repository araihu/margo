name: Publish schema reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'schema/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish exact schema bytes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage schema-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/schema
          cp -R schema/v1 _site/schema/v1
          test "$(find _site -type f | LC_ALL=C sort)" = $'_site/schema/v1/document.json\n_site/schema/v1/policy.json'
          cmp schema/v1/document.json _site/schema/v1/document.json
          cmp schema/v1/policy.json _site/schema/v1/policy.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload exact schema bytes
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
